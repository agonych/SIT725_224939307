<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Book Catalogue</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<h1>Books Catalogue</h1>
<p>Click the button below to get all books from the server.</p>
<button id="books-load" class="btn">Get all books</button>

<div id="books-row" class="books-row">
    <div class="book-block">
        <ul id="books-list" class="books-list"></ul>
    </div>
</div>

<div id="book-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
        <button id="modal-close" class="modal-close" type="button">Close</button>
        <h3 id="modal-title"></h3>
        <dl class="modal-details">
            <div>
                <dt>Author:</dt>
                <dd id="modal-author"></dd>
            </div>
            <div>
                <dt>Year:</dt>
                <dd id="modal-year"></dd>
            </div>
            <div>
                <dt>Genre:</dt>
                <dd id="modal-genre"></dd>
            </div>
            <div>
                <dt>Summary:</dt>
                <dd id="modal-summary"></dd>
            </div>
            <div>
                <dt>Price:</dt>
                <dd id="modal-price"></dd>
            </div>
        </dl>
    </div>
</div>
<script src="/js/scripts.js"></script>
</body>
</html>
